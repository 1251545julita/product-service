spring:
  application:
    name: product-service

  datasource:
    url: "jdbc:mysql://localhost:3306/product_service?createDatabaseIfNotExist=true"
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: admin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      indent-output: true
    deserialization:
      fail-on-unknown-properties: true

server:
  port: "8082"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/